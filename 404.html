<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-family: 'Georgia', serif;
        }

        .error-page {
            text-align: center;
            max-width: 700px;
            padding: 20px;
        }

        .error-page img {
            width: 100%;
            max-width: 600px;
            border-radius: 0;
            box-shadow: none;
            border: none;
            display: block;
        }

        .error-page h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin: 24px 0 12px;
        }

        .error-page p {
            font-size: 1.1rem;
            color: #5a6c7d;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.4);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.6);
        }

        .btn-home:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <img src="images/404-sea.png" alt="404 — Страница затерялась среди волн">
        <h1>Страница не найдена</h1>
        <p>
          Страница затерялась среди волн<br>

        </p>
        <a href="/" class="btn-home">Вернуться на главную</a>
    </div>
</body>
</html>
